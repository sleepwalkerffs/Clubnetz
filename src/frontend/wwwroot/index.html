<!DOCTYPE html>
<html lang="en" translate="no">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Clubnetz</title>
    <base href="/" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#064E3B" />
    <meta name="application-name" content="Clubnetz" />
    <meta name="apple-mobile-web-app-title" content="Clubnetz" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="Bookennis.Client.styles.css" rel="stylesheet" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="stylesheet" href="lib/cropper/cropper.min.css" />
    <script src="theme.js"></script>
</head>

<body>
    <div id="app">
        <!-- The Clubnetz icon (icons/icon.svg). The C is drawn towards the ball while the app loads, see app-loading-progress.css -->
        <svg class="loading-logo" viewBox="0 0 512 512" role="img" aria-label="Clubnetz">
            <defs>
                <linearGradient id="loading-logo-bg" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#064E3B" />
                    <stop offset="0.4" stop-color="#047857" />
                    <stop offset="0.75" stop-color="#0D9488" />
                    <stop offset="1.15" stop-color="#65A30D" />
                </linearGradient>
                <clipPath id="loading-logo-shape"><rect width="512" height="512" rx="112" /></clipPath>
            </defs>
            <g clip-path="url(#loading-logo-shape)">
                <rect width="512" height="512" fill="url(#loading-logo-bg)" />
                <g transform="rotate(-12 256 256)" fill="none" stroke="#FFFFFF" stroke-opacity="0.13" stroke-width="10">
                    <rect x="-40" y="56" width="592" height="400" rx="8" />
                    <path d="M256 56V456M90 256H422" />
                </g>
            </g>
            <!-- Same C as in the icon, but starting at its lower end so it grows towards the ball -->
            <path class="loading-logo__track" d="M341.6 341.6A121 121 0 1 1 277 136.8" />
            <path class="loading-logo__fill" d="M341.6 341.6A121 121 0 1 1 277 136.8" />
            <circle class="loading-logo__ball" cx="352" cy="181" r="37" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>
    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_content/Microsoft.AspNetCore.Components.WebAssembly.Authentication/AuthenticationService.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="pwa.js"></script>
    <script src="lib/cropper/cropper.min.js"></script>
    <script src="js-helpers.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js?v=20260328"></script>
</body>

</html>
