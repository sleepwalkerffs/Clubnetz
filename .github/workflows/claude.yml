name: Claude agent

# Lets Claude work on issues and pull requests.
#   - A new issue opened by the owner gets a plan as a comment. No code is changed.
#   - "@claude ..." in an issue or PR comment (or a PR review) runs Claude on that request,
#     for example "@claude go" to implement the plan, or feedback on its pull request.
#
# Only the repository owner can trigger it, so text from other people never reaches Claude.
# How Claude works on issues is described in CLAUDE.md ("Working on GitHub issues").
#
# Setup:
#   - Install the Claude GitHub App on this repository: https://github.com/apps/claude
#   - Run `claude setup-token` locally and store the token as the repository secret
#     CLAUDE_CODE_OAUTH_TOKEN. Runs then count against the owner's Claude subscription.
#   - Protect master, stage and production so Claude can only open pull requests (rulesets:
#     master needs a pull request, only admins may push to stage and production).

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# One run per issue or pull request at a time, later requests wait for the running one
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  # A new issue from the owner: read the code and post a plan, nothing else
  plan:
    if: github.event_name == 'issues' && github.event.issue.user.login == 'sleepwalkerffs'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ask Claude for a plan
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE: #${{ github.event.issue.number }}

            A new issue was opened. Read it with `gh issue view ${{ github.event.issue.number }}`,
            follow the "Working on GitHub issues" section of CLAUDE.md, explore the code and post
            a plan as a single comment with `gh issue comment ${{ github.event.issue.number }} --body-file <file>`.
            Do not change any code in this run.
          claude_args: |
            --allowedTools "Agent,Task,Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh search:*),Bash(git log:*),Bash(git diff:*),Write"

  # "@claude ..." from the owner in a comment or review: plan, implement or address feedback
  respond:
    if: |
      github.actor == 'sleepwalkerffs' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    # Same database the test workflow uses. The tests create their own databases in it,
    # so no real member data is ever involved.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: developer
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore workloads
        working-directory: ./src/
        run: dotnet workload restore

      # A headless Chrome (preinstalled on the runner) that Claude drives through the Playwright MCP
      # server to look at the UI it built, see "Checking the UI" in CLAUDE.md. It may only load the
      # local app (and its Google font). Screenshots land in ui-check/ and are uploaded as an artifact.
      - name: Set up the browser for UI checks
        run: |
          mkdir -p "$RUNNER_TEMP/ui-check"
          cat > "$RUNNER_TEMP/playwright-mcp.json" <<JSON
          {
            "mcpServers": {
              "playwright": {
                "command": "npx",
                "args": ["-y", "@playwright/mcp@0.0.83", "--browser", "chrome", "--headless", "--isolated",
                         "--allowed-origins", "http://localhost:5080;https://fonts.googleapis.com;https://fonts.gstatic.com",
                         "--output-dir", "$RUNNER_TEMP/ui-check"]
              }
            }
          }
          JSON

      # No prompt given, so the action runs in tag mode: it answers in a progress comment,
      # commits to a claude/... branch and links a ready-made pull request
      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
          # For psql against the job's PostgreSQL service (test databases only)
          PGPASSWORD: developer
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # Only your comments and Claude's own reach the prompt, so text planted by others in a
          # public issue or pull request can't steer it
          include_comments_by_actor: sleepwalkerffs,claude[bot]
          # gh pr: open, edit and look at pull requests (not merge them). git checkout/switch/merge: continue
          # on the branch of an existing pull request (gh pr checkout fetches it). No plain git push or
          # git fetch, they can run arbitrary commands via --receive-pack/--upload-pack: Claude pushes with
          # the action's own push script, which only accepts "origin <branch>". stage and production
          # only take pushes from admins (ruleset), master only takes pull requests.
          # scripts/ui-check, psql and mcp__playwright: run the app with test data and look at it.
          claude_args: |
            --mcp-config ${{ runner.temp }}/playwright-mcp.json
            --allowedTools "Agent,Task,Bash(dotnet:*),Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr create:*),Bash(gh pr edit:*),Bash(gh pr comment:*),Bash(gh pr checks:*),Bash(gh pr checkout:*),Bash(gh run view:*),Bash(gh run list:*),Bash(git checkout:*),Bash(git switch:*),Bash(git branch:*),Bash(git status:*),Bash(git log:*),Bash(git diff:*),Bash(git add:*),Bash(git commit:*),Bash(git merge:*),Bash(scripts/ui-check/start-app.sh:*),Bash(scripts/ui-check/seed.sh:*),Bash(psql:*),mcp__playwright__*"

      - name: Upload UI check screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-check-${{ github.run_id }}
          path: ${{ runner.temp }}/ui-check
          if-no-files-found: ignore
          retention-days: 14
