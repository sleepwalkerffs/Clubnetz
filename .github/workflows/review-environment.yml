name: Review environment

# Every pull request from a branch of this repository gets its own copy of the app at
# https://pr-<number>.review.clubnetz.app, with a pseudonymized copy of the production data and
# behind a username and password prompt. Pushing to the pull request updates it, closing it removes it.
# Pull requests from forks never get one: their code would run on the server.
#
# Setup (server side, DNS and secrets): scripts/review/README.md. Needs
#   repository variable  REVIEW_SSH_HOST         the server's address; nothing runs while it is not set
#   environment "Review" secret REVIEW_SSH_KEY          private key whose public key setup-server.sh installed
#   environment "Review" secret REVIEW_SSH_KNOWN_HOSTS  output of: ssh-keyscan <server>

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

# One run per pull request at a time. A newer push replaces a deployment that is still waiting.
concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

env:
  IMAGE: ghcr.io/sleepwalkerffs/clubnetz-review
  PR: ${{ github.event.pull_request.number }}

jobs:
  deploy:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      vars.REVIEW_SSH_HOST != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    environment:
      name: Review
      url: https://pr-${{ github.event.pull_request.number }}.review.clubnetz.app/

    steps:
      # The merge result of the pull request, i.e. what master would look like after merging
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:pr-${{ env.PR }}
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            SOURCE_REVISION_ID=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the review environment
        env:
          SSH_KEY: ${{ secrets.REVIEW_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.REVIEW_SSH_KNOWN_HOSTS }}
          HOST: ${{ vars.REVIEW_SSH_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/review && chmod 600 ~/.ssh/review
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/review -o BatchMode=yes "clubnetz-review@$HOST" "deploy $PR $GITHUB_SHA"

  remove:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      vars.REVIEW_SSH_HOST != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Review

    steps:
      - name: Remove the review environment
        env:
          SSH_KEY: ${{ secrets.REVIEW_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.REVIEW_SSH_KNOWN_HOSTS }}
          HOST: ${{ vars.REVIEW_SSH_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/review && chmod 600 ~/.ssh/review
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/review -o BatchMode=yes "clubnetz-review@$HOST" "remove $PR"
