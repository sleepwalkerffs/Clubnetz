name: Build image and deploy

# Pushing to stage or production builds the Docker image, publishes it to the GitHub Container
# Registry and asks Coolify to roll it out. Each environment (Staging, Production) needs the secrets
#   COOLIFY_WEBHOOK_URL  the deploy webhook of the application in Coolify
#   COOLIFY_TOKEN        a Coolify API token that is allowed to deploy

on:
  push:
    branches: [stage, production]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/sleepwalkerffs/clubnetz

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The branch tag (stage, production) is what Coolify pulls, the commit tag is for rolling back
      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            SOURCE_REVISION_ID=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: ${{ github.ref_name == 'production' && 'Production' || 'Staging' }}

    steps:
      - name: Ask Coolify to deploy the new image
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl --request POST --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_WEBHOOK_URL"
